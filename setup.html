<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعداد حساب الإدارة — عقاري</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="https://abdulazizrashudi-blip.github.io/" class="brand">
      <span class="logo-badge">🏠</span>
      عقاري
    </a>
  </div>
</header>

<div class="login-wrap">
  <div class="login-box">
    <h2>إنشاء حساب الإدارة الأول</h2>
    <p class="sub">هذه الصفحة تُستخدم مرة واحدة فقط لإنشاء أول حساب مدير للموقع. اكتب بريدك وكلمة مرور من اختيارك — لن يطّلع عليها أحد غيرك.</p>
    <div id="setup-alert"></div>
    <form id="setup-form">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="s-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="s-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="setup-btn">إنشاء الحساب</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth } from './firebase.js';
  import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const form = document.getElementById('setup-form');
  const alertBox = document.getElementById('setup-alert');
  const btn = document.getElementById('setup-btn');

  function showAlert(message, type) {
    alertBox.innerHTML = `<div class="alert ${type}">${type === 'error' ? '⚠️' : '✅'} <div>${message}</div></div>`;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('s-email').value.trim();
    const password = document.getElementById('s-password').value;
    btn.disabled = true;
    btn.textContent = 'جاري الإنشاء...';
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      showAlert(
        `تم إنشاء الحساب بنجاح. الآن أرسل هذا المعرف (UID) للمطوّر عشان يفعّل صلاحيات الإدارة:<br><br><code style="user-select:all; direction:ltr; display:inline-block; background:#f7f8fa; padding:8px 10px; border-radius:8px;">${cred.user.uid}</code>`,
        'success'
      );
      form.reset();
      btn.style.display = 'none';
    } catch (err) {
      let msg = 'تعذّر إنشاء الحساب، حاول مرة أخرى';
      if (err && err.code === 'auth/email-already-in-use') msg = 'هذا البريد مستخدم مسبقًا — سجّل دخولك من لوحة التحكم مباشرة';
      if (err && err.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة جدًا (6 أحرف على الأقل)';
      showAlert(msg, 'error');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'إنشاء الحساب';
    }
  });
</script>
</body>
</html>
